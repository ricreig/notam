app = "notam-frontend-ctareig"
primary_region = "sjc"

[build]
  # Pasamos la URL del API al build de Vite como ARG
  build_args = { VITE_API_URL = "https://notam-api-ctareig.fly.dev" }

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout  = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
