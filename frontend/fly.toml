app = "notam-frontend-ctareig"
primary_region = "sjc"

[build]
  [build.args]
    VITE_API_URL = "https://notam-api-ctareig.fly.dev"
	VITE_MAPBOX_TOKEN = "pk.eyJ1IjoicmljcmVpZyIsImEiOiJjbWcwZ2gyYm4wZDk5MmlvamdpbWR6cTA5In0.IsmjO6d-ClnQ3SybCESyCQ"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout  = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"
